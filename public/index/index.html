<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANAPTAI - AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 16px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #0f172a;
      color: #cbd5e1;
      display: none;
      white-space: pre-wrap;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🎬 SANAPTAI</h1>
      <p>AI Video Generator</p>
    </div>

    <div class="card">

      <label for="prompt">Enter Your Video Prompt</label>

      <textarea
        id="prompt"
        placeholder="Example: A cinematic 10-second video of a futuristic city at night..."
      ></textarea>

      <button onclick="generateVideo()">
        🚀 Generate Video
      </button>

      <div id="result"></div>

    </div>

    <div class="footer">
      SANAPTAI AI • Video Creation Platform
    </div>

  </div>

  <script>
    async function generateVideo() {

      const prompt = document.getElementById("prompt").value.trim();
      const result = document.getElementById("result");

      if (!prompt) {
        result.style.display = "block";
        result.textContent = "Please enter a video prompt first.";
        return;
      }

      result.style.display = "block";
      result.textContent = "Connecting to SANAPTAI backend...";

      try {
        const response = await fetch(
          "https://sanaptai.onrender.com/api/test"
        );

        const data = await response.json();

        result.textContent =
          "Backend connected successfully! 🚀\n\n" +
          "Message: " + data.message +
          "\n\nYour prompt:\n" + prompt;

      } catch (error) {
        result.textContent =
          "Unable to connect to SANAPTAI backend.\n\n" +
          error.message;
      }
    }
  </script>

</body>
  </html>
